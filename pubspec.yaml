name: mother_care
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1

  # Firebase packages – all compatible with each other (using major version 3)
  firebase_core: ^3.12.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_database: ^11.3.0

  # Networking & location
  http: ^1.2.1
  geolocator: ^13.0.2          # Version 14.x has breaking changes; 13.0.2 is stable
  flutter_map: ^7.0.0          # Version 7.x works with latlong2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true